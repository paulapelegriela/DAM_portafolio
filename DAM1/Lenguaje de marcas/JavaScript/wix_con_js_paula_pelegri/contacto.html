<!DOCTYPE html>
<html>
<head>
    <title>Bloombeauty contacto</title>
    <link rel="stylesheet" href="./contacto.css">
</head>
<body>
<div  class="encabezado">
	<a href="bloombeauty.html">Inicio</a>&emsp;
	<a href="contacto.html">Contacto</a>&emsp;
</div>	
<div class="contacto-fondo">
    <h1 class="titulo">Contacto</h1>
    <h3 class="subtitulo">¡Contacta con nosotros sobre cualquier duda!</h3>

    <h3 class="subtitulo-form">Contacta con nosotros</h3>

    <div class="caja-formulario">
        <form id="formulario"novalidate>
            <input type="text" placeholder="Nombre" id="nombre">
            <input type="email" placeholder="Email" id="email" required minlength="15" maxlength="50">
            <p id="email-error"></p>
            <input type="text" placeholder="Teléfono" id="telefono">
            <textarea placeholder="Escribe tu mensaje aquí..." rows="10"></textarea>
            <input type="submit" value="Enviar">
        </form>
        <p id="resultado-formulario"></p>
    </div>
</div>
<div class="footer-naranja">
    <small>© 2025 Bloom beauty. Creado con HTML y CSS por Paula</small>
</div>
<script src="contacto.js"></script>
</body>
</html>
